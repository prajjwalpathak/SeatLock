# Same-origin demo mode (W8·D4). On top of docker-compose.local.yml + docker-compose.scale.yml:
#   cd frontend; npm run build              # with VITE_API_BASE_URL=http://localhost:8088 in frontend/.env.local
#   docker compose --env-file .env -f infra/docker-compose.local.yml -f infra/docker-compose.scale.yml \
#     -f infra/docker-compose.demo.yml up -d --no-build
# → open http://localhost:8088 (UI + API + WebSocket on one origin). See nginx/local/seatlock-lb-spa.conf.
services:
  app-1:
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8088   # WebSocket handshakes check Origin (#154)
  app-2:
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8088
  lb:
    volumes:
      - ./nginx/local/seatlock-lb-spa.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
