# Local dev infrastructure. Run from the repo root:
#   docker compose --env-file .env -f infra/docker-compose.local.yml up -d
# Monitoring (W6·D2): Prometheus http://localhost:9090, Grafana http://localhost:3000 (admin / GRAFANA_ADMIN_PASSWORD).
# Prometheus scrapes the IDE app (host port 8080) and app-1/app-2 when the scale overlay runs (docs/monitoring.md).
name: seatlock-local

services:
    postgres:
        image: pgvector/pgvector:pg16 # Postgres 16 + pgvector (used in Week 7)
        container_name: seatlock-postgres
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-seatlock}
            POSTGRES_USER: ${POSTGRES_USER:-seatlock}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
        ports:
            - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        container_name: seatlock-redis
        ports:
            - "127.0.0.1:${REDIS_PORT:-6379}:6379"
        volumes:
            - redisdata:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped

    prometheus:
        image: prom/prometheus:v3.13.5 # 3.13 = LTS line (supported to Jul 2027)
        container_name: seatlock-prometheus
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=7d
        ports:
            - "127.0.0.1:9090:9090"
        extra_hosts:
            - "host.docker.internal:host-gateway" # the backend running in IntelliJ on the laptop
        volumes:
            - ./prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
            - promdata:/prometheus
        healthcheck: # same as prod (W8·D2)
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        restart: unless-stopped

    grafana:
        image: grafana/grafana:13.2.4
        container_name: seatlock-grafana
        environment:
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin} # local only; prod requires its own
            GF_USERS_ALLOW_SIGN_UP: "false"
            GF_AUTH_ANONYMOUS_ENABLED: "false"
            GF_ANALYTICS_REPORTING_ENABLED: "false"
            GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
            GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/seatlock.json
        ports:
            - "127.0.0.1:3000:3000"
        volumes:
            - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
            - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
            - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
            - grafanadata:/var/lib/grafana
        healthcheck: # same as prod, without the /grafana sub-path (W8·D2)
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
        depends_on:
            prometheus:
                condition: service_healthy
        restart: unless-stopped

volumes:
    pgdata:
    redisdata:
    promdata:
    grafanadata:
