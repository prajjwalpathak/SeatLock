# Local dev infrastructure. Run from the repo root:
#   docker compose --env-file .env -f infra/docker-compose.local.yml up -d
name: seatlock-local

services:
    postgres:
        image: pgvector/pgvector:pg16 # Postgres 16 + pgvector (used in Week 7)
        container_name: seatlock-postgres
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-seatlock}
            POSTGRES_USER: ${POSTGRES_USER:-seatlock}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
        ports:
            - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        container_name: seatlock-redis
        ports:
            - "127.0.0.1:${REDIS_PORT:-6379}:6379"
        volumes:
            - redisdata:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped

volumes:
    pgdata:
    redisdata:
