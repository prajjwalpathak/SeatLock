# Benchmark overlay (W6·D4): add as a THIRD file to the local + scale stack, for benchmarks only:
#   docker compose --env-file .env -f infra/docker-compose.local.yml -f infra/docker-compose.scale.yml \
#     -f infra/docker-compose.bench.yml up -d app-1 app-2
# Driven by load-tests/bench-strategies.ps1 through these shell variables:
#   BENCH_STRATEGY         redis-hold (default) | optimistic          → seatlock.holds.strategy
#   BENCH_VIRTUAL_THREADS  false (default) | true                     → spring.threads.virtual.enabled
# Rate limiting is OFF here: it's the same code for every variant and would only cap the measured numbers.
# Recreate without this file afterwards to get the normal stack back.

x-bench-env: &bench-env
  SEATLOCK_HOLDS_STRATEGY: ${BENCH_STRATEGY:-redis-hold}
  SPRING_THREADS_VIRTUAL_ENABLED: ${BENCH_VIRTUAL_THREADS:-false}
  SEATLOCK_RATELIMIT_ENABLED: "false"

services:
  app-1:
    environment:
      <<: *bench-env
  app-2:
    environment:
      <<: *bench-env
