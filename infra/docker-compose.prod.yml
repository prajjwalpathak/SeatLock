# Production stack for the Azure VM (single host, Docker Compose).
# Run from the repo root ON THE VM:
#   docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml up -d
# New backend versions arrive through CI: GitHub Actions -> GHCR -> infra/scripts/deploy.sh.
# First-time TLS certificate: see docs/deploy.md (certbot "standalone" before Nginx starts).
#
# Only Nginx is reachable from the internet (80/443). App, Postgres, Redis and Prometheus sit on the
# private Compose network with no published ports; Grafana is served by Nginx at /grafana/ (its own login).
name: seatlock-prod

x-logging: &default-logging          # cap Docker logs so they can't fill the 30 GB disk
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16      # same image as local (pgvector used in Week 7)
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seatlock}
      POSTGRES_USER: ${POSTGRES_USER:-seatlock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env.prod}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=50"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768m
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Cache + short-lived OAuth/one-time-code keys only: no persistence needed.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *default-logging
    restart: unless-stopped

  # Two instances of one image (W5·D5): Nginx balances between them, seat events cross via Redis Pub/Sub,
  # deploy.sh replaces them one at a time. Limits: 2 × 900 + PG 768 + Redis 256 + Prometheus 256 + Grafana 384
  # + nginx/certbot ≈ 3.5 GB of 3.8 GB (limits, not usage: measured idle ≈ 1.5 GiB before W6·D2); 2 GB swap.
  app-1: &app
    # CI-built image from GHCR (public). deploy.sh writes the exact tag to APP_IMAGE in .env.prod.
    image: ${APP_IMAGE:-ghcr.io/prajjwalpathak/seatlock-backend:latest}
    env_file: .env.prod                # JWT keys, admin, Google, CORS, frontend URL (relative to this file)
    environment: &app-env
      SPRING_PROFILES_ACTIVE: prod
      # W7·D6: heap 60 % of 900 MB (image default 70 %) to leave native room for the ONNX embedding model
      # (+~130 MiB measured idle). Same flags as the Dockerfile otherwise (G1, F11).
      JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError -Duser.timezone=UTC"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SEATLOCK_INSTANCE_ID: app-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 900m                 # JVM heap = 70% of this (MaxRAMPercentage in the Dockerfile); ~370 MiB idle
    logging: *default-logging
    restart: unless-stopped

  app-2:
    <<: *app
    environment:
      <<: *app-env
      SEATLOCK_INSTANCE_ID: app-2

  # Monitoring (W6·D2, ADR-015). Scrapes app-1/app-2 every 15 s; 7 days kept (a few hundred MB at most).
  prometheus:
    image: prom/prometheus:v3.13.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in infra/.env.prod}
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/seatlock.json
      GF_UNIFIED_ALERTING_ENABLED: "false"      # no alert rules here; saves the Alertmanager + rule engine memory
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          # 192m starved Grafana 13 (171/192 MiB, 17.6 GB of re-reads, not listening after 7 min: W6·D2 rollout)
          memory: 384m
    logging: *default-logging
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in infra/.env.prod}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro     # *.template -> /etc/nginx/conf.d (envsubst)
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # Reload every 6 h so a renewed certificate is picked up without downtime.
    command: ["/bin/sh", "-c", "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Renewal loop: certbot only renews when < 30 days remain, so twice a day is cheap.
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    logging: *default-logging
    restart: unless-stopped

volumes:
  pgdata:
  letsencrypt:
  certbot-www:
  promdata:
  grafanadata:
