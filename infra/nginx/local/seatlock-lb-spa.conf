# Same-origin demo mode (W8·D4, docker-compose.demo.yml): the local LB on http://localhost:8088 serves the BUILT
# frontend (frontend/dist) at / and proxies the API, WebSocket and OAuth paths to app-1 / app-2. One origin, like a
# real single-site deployment: used to record the README GIFs in a browser that blocks cross-port calls
# (5173 → 8088), and handy for demos without `npm run dev`. Otherwise identical to seatlock-lb.conf.

# Connection header: "upgrade" for WebSocket handshakes, empty otherwise, so plain requests can reuse
# keep-alive connections to the upstream ("close" would defeat keepalive below).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Docker's DNS, re-resolved at runtime: a restarted app container with a new IP doesn't leave Nginx on a stale one.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream seatlock_app {
    zone seatlock_app 64k;                    # shared memory: required for "resolve"
    # Round robin. Passive health: one failed connect takes a server out for 5 s, then it's retried.
    server app-1:8080 resolve max_fails=1 fail_timeout=5s;
    server app-2:8080 resolve max_fails=1 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 80;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 2s;
    proxy_read_timeout    60s;
    # A refused/failed connect moves the request to the other instance. Only before anything was sent,
    # and never for POST/DELETE (Nginx doesn't retry non-idempotent methods unless told to).
    proxy_next_upstream error timeout;

    # Which upstream answered, for the cross-instance checks (the app also sends X-SeatLock-Instance)
    add_header X-Upstream $upstream_addr always;

    # STOMP over WebSocket: a long-lived connection pinned to whichever instance accepted it.
    # Server and client heart-beat every 10 s, so 75 s without a byte means the connection is dead.
    location /ws {
        proxy_pass http://seatlock_app;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location /api/       { proxy_pass http://seatlock_app; }
    location /actuator/  { proxy_pass http://seatlock_app; }
    location /oauth2/    { proxy_pass http://seatlock_app; }
    location /login/oauth2/ { proxy_pass http://seatlock_app; }
    location /v3/        { proxy_pass http://seatlock_app; }
    location /swagger-ui { proxy_pass http://seatlock_app; }

    # Everything else: the SPA. Unknown paths fall back to index.html (client-side routes like /shows/12).
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
