# Grafana data source, provisioned from Git (no clicks). The fixed uid is what the dashboard JSON refers to.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s          # = scrape interval: $__rate_interval never goes below one scrape
