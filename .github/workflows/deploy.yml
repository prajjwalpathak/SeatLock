# Deploy pipeline: runs only after CI has passed on main (or manually).
#   image  -> build the backend Docker image once, push it to GHCR (tagged sha-<commit> + latest)
#   deploy -> SSH (restricted key) to the Azure VM: infra/scripts/deploy.sh pulls that exact tag,
#             waits for healthy, rolls back automatically if not; then a public smoke test
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:          # manual run: Actions -> Deploy -> Run workflow
    inputs:
      tag:
        description: "Existing image tag to deploy, e.g. sha-1a2b3c4d5e6f (rollback). Empty = build and deploy current main."
        required: false
        default: ""

# Never run two deploys at once; a newer one waits instead of cancelling a half-finished deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/prajjwalpathak/seatlock-backend      # GHCR names must be lowercase
  # The commit CI actually tested (workflow_run), or the current commit (manual run)
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  image:
    name: Build & push image
    # Only when CI passed (a failed CI also "completes", so check the conclusion)
    if: (github.event_name == 'workflow_dispatch' && inputs.tag == '') || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write           # push to GHCR with the built-in GITHUB_TOKEN (no personal token)
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - id: vars
        run: echo "tag=sha-${SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64          # the VM is x64 (ADR-005): no QEMU emulation needed
          build-args: |
            GIT_SHA=${{ env.SHA }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.title=seatlock-backend
          cache-from: type=gha
          cache-to: type=gha,mode=max      # reuse unchanged layers (Maven deps) across runs

      - name: Summary
        run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}:${{ steps.vars.outputs.tag }}\` (also \`latest\`)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Azure VM
    needs: image
    # Runs after a successful build, or alone for a manual rollback (image job skipped)
    if: always() && (needs.image.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || needs.image.outputs.tag }}
    environment:
      name: production
      url: https://seatlock-prajjwal.duckdns.org/swagger-ui.html
    steps:
      - name: Configure SSH (pinned host key, never trust-on-first-use)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The key is pinned to deploy.sh on the VM: this "command" is only the tag argument.
      - name: Deploy ${{ env.TAG }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 "ubuntu@${HOST}" "deploy ${TAG}"

      - name: Smoke test through Nginx (healthy + running the expected commit)
        run: |
          base=https://seatlock-prajjwal.duckdns.org
          want="${TAG#sha-}"                       # 12-char commit prefix ("latest" -> skip the check)
          for i in $(seq 1 10); do
            if curl -fsS "$base/actuator/health/readiness" | grep -q '"UP"'; then
              rev=$(curl -fsS "$base/api/v1/system/version" | sed -E 's/.*"revision":"([^"]*)".*/\1/')
              echo "live revision: $rev"
              if [ "$TAG" = latest ] || [ "${rev:0:12}" = "$want" ]; then exit 0; fi
            fi
            sleep 3
          done
          echo "::error::live server is not healthy or not running $TAG"
          exit 1

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key

