# CI: runs on every push and pull request.
#   backend  -> Maven verify (unit + Testcontainers integration tests, JaCoCo report)
#   frontend -> npm ci, lint, type-check + production build
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older, still-running CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read            # least privilege: CI only reads the repo

jobs:
  # W8·D1: gitleaks over the whole history (fetch-depth 0). Not a required check (yet): a finding fails this job and
  # shows on the PR; .gitleaks.toml allow-lists only reviewed false positives (docs/SECURITY.md).
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks (full history, redacted)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" --entrypoint sh zricethezav/gitleaks:v8.30.1 -c \
            'git config --global --add safe.directory /repo && gitleaks git /repo --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore --redact --verbose'

  backend:
    name: Backend (build, test, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Our own cache instead of setup-java's "cache: maven": that one is keyed only on the pom hash, so every pom
      # change started from an empty ~/.m2 and re-downloaded everything from Maven Central, which then answered 429
      # (rate limit on shared runner IPs, W6·D1). restore-keys falls back to the newest older cache: only new or
      # changed artifacts are downloaded.
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      # Testcontainers needs Docker: GitHub's ubuntu runners have it preinstalled.
      - name: Maven verify
        run: |
          chmod +x mvnw
          # retries with backoff if Central rate-limits (429) or blips (5xx) while downloading
          ./mvnw -B -ntp -Daether.connector.http.retryHandler.count=5 -Daether.connector.http.retryHandler.interval=10000 verify

      - name: Coverage summary
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [ -f "$csv" ]; then
            awk -F, 'NR>1{im+=$4;ic+=$5;bm+=$6;bc+=$7;lm+=$8;lc+=$9}
              END{printf "### JaCoCo coverage\n| Instructions | Lines | Branches |\n|---|---|---|\n| %.1f%% | %.1f%% | %.1f%% |\n",
                  100*ic/(im+ic), 100*lc/(lm+lc), 100*bc/(bm+bc)}' "$csv" >> "$GITHUB_STEP_SUMMARY"
            echo "Gate (pom.xml, jacoco:check): lines >= 85 %, branches >= 80 %; the build fails below." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 26
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: Build (tsc + vite)
        run: npm run build
        env:
          VITE_API_BASE_URL: https://seatlock-prajjwal.duckdns.org
