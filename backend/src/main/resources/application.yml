spring:
  application:
    name: seatlock-backend


  profiles:
    default: local               # used when SPRING_PROFILES_ACTIVE is not set

  # Local dev: read the repo-root .env as properties. Skipped when absent (Docker/CI).
  # Real OS environment variables take precedence over values from this file.
  config:
    import: "optional:file:../.env[.properties]"

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:seatlock}
    username: ${POSTGRES_USER:seatlock}
    password: ${POSTGRES_PASSWORD}

  jpa:
    open-in-view: false          # no lazy-loading during view rendering (antipattern)
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only checks it

  security:
    oauth2:
      client:
        registration:
          google:                      # callback: {baseUrl}/login/oauth2/code/google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile   # basic sign-in scopes only (no Google verification needed)

  data:
    redis:
      repositories:
        enabled: false           # Redis is cache + keys only; stops repository-scan noise at startup
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms             # fail fast: a slow Redis must not stall every request (cache falls back to DB)

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

seatlock:
  build:
    revision: ${SEATLOCK_REVISION:local}      # git commit, baked into the image by CI (GET /api/v1/system/version)
  cache:
    enabled: ${SEATLOCK_CACHE_ENABLED:true}   # false = kill switch / "before" benchmarks (NoOpCacheManager)
  jwt:
    issuer: seatlock             # "iss" claim; the decoder rejects anything else
    audience: seatlock-api       # "aud" claim
    access-token-ttl: 8h         # no refresh tokens (decision #43): this is the session length
    # RS256 key pair, base64 DER on one line (PEM headers optional). Local: repo-root .env.
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
  holds:
    ttl: 8m                      # how long seats stay held (decision #83); all hold keys share this TTL
    max-seats: 6                 # seats per hold; the UI uses the same cap
  rate-limit:
    enabled: true
    policies:
      holds:                     # POST /api/v1/shows/{id}/holds (decision #104)
        per-ip:   { capacity: 30, refill-tokens: 30, refill-period: 1m }   # a busy NAT/office still fits
        per-user: { capacity: 5,  refill-tokens: 10, refill-period: 1m }   # burst 5, then 10 per minute
  bookings:
    sweep-interval: PT30S        # BookingExpirySweeper: expire unpaid bookings past expiresAt
    sweep-batch-size: 100        # rows locked (SKIP LOCKED) and expired per transaction
    sweep-max-batches: 20        # per run; a backlog continues on the next run
  payments:
    gateway: ${SEATLOCK_PAYMENTS_GATEWAY:mock}   # mock | razorpay; tests and load tests always use mock
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}                 # rzp_test_... only (checked at startup)
      key-secret: ${RAZORPAY_KEY_SECRET:}         # never logged, never sent to the browser
      base-url: https://api.razorpay.com
      connect-timeout: 2s
      read-timeout: 5s
  idempotency:
    ttl: 24h                     # how long a key's response is replayed (decision #90)
    lease: 30s                   # an IN_PROGRESS claim older than this may be taken over by a retry
    cleanup-interval: PT1H       # IdempotencyCleanupJob: delete expired keys hourly (ISO-8601)
  admin:
    # Bootstrap ADMIN account (created once at startup if missing). Both empty = skipped.
    email: ${SEATLOCK_ADMIN_EMAIL:}
    password: ${SEATLOCK_ADMIN_PASSWORD:}
