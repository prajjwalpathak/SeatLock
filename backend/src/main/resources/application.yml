spring:
  application:
    name: seatlock-backend


  profiles:
    default: local               # used when SPRING_PROFILES_ACTIVE is not set

  # Local dev: read the repo-root .env as properties. Skipped when absent (Docker/CI).
  # Real OS environment variables take precedence over values from this file.
  config:
    import: "optional:file:../.env[.properties]"

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:seatlock}
    username: ${POSTGRES_USER:seatlock}
    password: ${POSTGRES_PASSWORD}
    hikari:
      # Fail fast when Postgres is unreachable (F8): Hikari's default waits 30 s for a connection, so every request
      # hung and held a Tomcat thread during an outage. Normal waits are far below 1 s; 3 s → quick 503 instead.
      connection-timeout: 3000
      # Explicit (= Hikari's default). W6·D6: 20 was faster on the laptop (rush p99 −26 %, throughput +8 %), but prod
      # Postgres has 2 vCPUs shared with the VM: 2 instances × 10 already exceed Hikari's (cores × 2) + 1 guidance.
      # Override per environment with SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE (docs/benchmarks.md section 6).
      maximum-pool-size: 10

  jpa:
    open-in-view: false          # no lazy-loading during view rendering (antipattern)
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only checks it

  security:
    oauth2:
      client:
        registration:
          google:                      # callback: {baseUrl}/login/oauth2/code/google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile   # basic sign-in scopes only (no Google verification needed)

  data:
    redis:
      repositories:
        enabled: false           # Redis is cache + keys only; stops repository-scan noise at startup
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Bounds a slow/hung Redis only: a DOWN Redis already fails at once (REJECT_COMMANDS, F1). 500 ms was too tight
      # for a CPU-saturated burst (k6 flash sale, first sale after a start: 25–50 × 503, F11); 2 s still caps the wait.
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        # prometheus: scraped by Prometheus on the Docker network (W6·D2). Never public: Nginx answers 404 for
        # /actuator/* except health, and the app ports are not published on the VM.
        include: health,info,prometheus
  metrics:
    tags:
      application: seatlock        # on every meter; the scrape adds instance (app-1 / app-2)
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true   # histogram buckets → p95/p99 per route in Grafana (histogram_quantile)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

seatlock:
  build:
    revision: ${SEATLOCK_REVISION:local}      # git commit, baked into the image by CI (GET /api/v1/system/version)
  instance-id: ${SEATLOCK_INSTANCE_ID:local}   # which app instance answered (X-SeatLock-Instance, /system/version); set per container
  cache:
    enabled: ${SEATLOCK_CACHE_ENABLED:true}   # false = kill switch / "before" benchmarks (NoOpCacheManager)
  jwt:
    issuer: seatlock             # "iss" claim; the decoder rejects anything else
    audience: seatlock-api       # "aud" claim
    access-token-ttl: 8h         # no refresh tokens (decision #43): this is the session length
    # RS256 key pair, base64 DER on one line (PEM headers optional). Local: repo-root .env.
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
  metrics:
    invariant-interval: PT1M     # SeatInvariantMonitor: re-count double-sold seats (seatlock.seats.double_sold)
  holds:
    ttl: 8m                      # how long seats stay held (decision #83); all hold keys share this TTL
    max-seats: 6                 # seats per hold; the UI uses the same cap
    strategy: ${SEATLOCK_HOLDS_STRATEGY:redis-hold}   # SeatLockingStrategy: redis-hold (Lua + TTL) | optimistic (Postgres upserts)
  rate-limit:
    enabled: true
    policies:
      holds:                     # POST /api/v1/shows/{id}/holds (decision #104)
        per-ip:   { capacity: 30, refill-tokens: 30, refill-period: 1m }   # a busy NAT/office still fits
        per-user: { capacity: 5,  refill-tokens: 10, refill-period: 1m }   # burst 5, then 10 per minute
  bookings:
    sweep-interval: PT30S        # BookingExpirySweeper: expire unpaid bookings past expiresAt
    sweep-batch-size: 100        # rows locked (SKIP LOCKED) and expired per transaction
    sweep-max-batches: 20        # per run; a backlog continues on the next run
  payments:
    gateway: ${SEATLOCK_PAYMENTS_GATEWAY:mock}   # mock | razorpay; tests and load tests always use mock
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}                 # rzp_test_... only (checked at startup)
      key-secret: ${RAZORPAY_KEY_SECRET:}         # never logged, never sent to the browser; signs checkout callbacks
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:} # set when creating the webhook in the dashboard; signs webhooks
      base-url: https://api.razorpay.com
      connect-timeout: 2s
      read-timeout: 5s
  refunds:
    interval: PT30S            # RefundWorker: send due refunds (outbox) every 30 s
    batch-size: 20             # refunds claimed per run
    lease: 2m                  # a claimed refund is invisible to other workers this long while the call runs
    policy:                    # cancellation of a CONFIRMED booking (decision #136): first tier met wins
      - { hours-before: 48, percent: 100 }
      - { hours-before: 24, percent: 50 }
  webhooks:
    retention: P30D            # WebhookEventCleanupJob: dedupe rows older than this are deleted daily
  idempotency:
    ttl: 24h                     # how long a key's response is replayed (decision #90)
    lease: 30s                   # an IN_PROGRESS claim older than this may be taken over by a retry
    cleanup-interval: PT1H       # IdempotencyCleanupJob: delete expired keys hourly (ISO-8601)
  admin:
    # Bootstrap ADMIN account (created once at startup if missing). Both empty = skipped.
    email: ${SEATLOCK_ADMIN_EMAIL:}
    password: ${SEATLOCK_ADMIN_PASSWORD:}
