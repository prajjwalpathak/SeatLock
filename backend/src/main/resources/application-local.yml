# Local development: the default profile (see spring.profiles.default)
management:
  endpoint:
    health:
      show-details: always       # show db/redis components while developing

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"   # e.g. "DEBUG [3f2a…]"; empty brackets outside requests
  level:
    com.seatlock: DEBUG

seatlock:
  frontend:
    base-url: http://localhost:5173   # where Google sign-in sends the browser back to
  cors:
    allowed-origins:
      - http://localhost:5173