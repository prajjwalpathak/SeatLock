# Production: activate with SPRING_PROFILES_ACTIVE=prod.
# Secrets come from real environment variables (no .env file on the server).
server:
  shutdown: graceful             # finish in-flight requests before stopping
  # Behind Nginx: trust X-Forwarded-Proto/For/Host from private-network proxies (Docker network),
  # so redirects (Google OAuth callback) are built as https://<domain>/... and client IPs are real.
  forward-headers-strategy: native

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoint:
    health:
      show-details: never        # never leak DB/Redis details publicly
      probes:
        enabled: true            # /actuator/health/liveness and /readiness (auto only on Kubernetes)
      group:
        readiness:
          include: readinessState,db,redis   # "can serve traffic"; liveness stays JVM-only

logging:
  structured:
    format:
      console: ecs                   # one JSON object per line (Elastic Common Schema)
  level:
    root: INFO
    com.seatlock: INFO

seatlock:
  frontend:
    base-url: ${FRONTEND_BASE_URL}             # e.g. https://seatlock.vercel.app
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}   # e.g. https://seatlock.vercel.app (comma-separated)
  jwt:
    private-key: ${JWT_PRIVATE_KEY}            # no default: startup fails if missing
    public-key: ${JWT_PUBLIC_KEY}
