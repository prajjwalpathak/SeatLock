# Tests: activate with @ActiveProfiles("test")
management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: WARN
    com.seatlock: INFO

# Real connection details come from Testcontainers (@ServiceConnection).
# These only satisfy placeholders in application.yml when no .env exists (e.g. CI).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/unused
    username: unused
    password: unused

seatlock:
  cors:
    allowed-origins:
      - http://localhost:5173
  jwt:
    # Ignore any keys in .env: tests always use a fresh in-memory key pair (same locally and in CI)
    private-key: ""
    public-key: ""
    allow-ephemeral-keys: true
  admin:
    # Ignore any admin in .env: tests create their own users
    email: ""
    password: ""
