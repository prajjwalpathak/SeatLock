# Tests: activate with @ActiveProfiles("test")
management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: WARN
    com.seatlock: INFO

# Real connection details come from Testcontainers (@ServiceConnection).
# These only satisfy placeholders in application.yml when no .env exists (e.g. CI).
spring:
  security:
    oauth2:
      client:
        registration:
          google:                      # dummy client: tests never call Google
            client-id: test-client-id
            client-secret: test-client-secret
  datasource:
    url: jdbc:postgresql://localhost:5432/unused
    username: unused
    password: unused

seatlock:
  rate-limit:
    policies:
      holds:                     # the whole suite runs from 127.0.0.1 → generous; RateLimit*Test checks the real behaviour
        per-ip:   { capacity: 100000, refill-tokens: 100000, refill-period: 1m }
        per-user: { capacity: 20,     refill-tokens: 20,     refill-period: 1m }
  payments:
    gateway: mock    # ignore SEATLOCK_PAYMENTS_GATEWAY in .env: tests never call a real provider
    razorpay:
      key-id: ""
      key-secret: test-key-secret          # tests sign checkout callbacks / webhooks with these (gateway stays mock)
      webhook-secret: test-webhook-secret
  scheduling:
    enabled: false   # no background jobs during tests; they're called directly
  frontend:
    base-url: http://localhost:5173
  cors:
    allowed-origins:
      - http://localhost:5173
  jwt:
    # Ignore any keys in .env: tests always use a fresh in-memory key pair (same locally and in CI)
    private-key: ""
    public-key: ""
    allow-ephemeral-keys: true
  admin:
    # Ignore any admin in .env: tests create their own users
    email: ""
    password: ""
